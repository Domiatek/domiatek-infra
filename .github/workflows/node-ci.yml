name: Node.js CI — Build & Test

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '20'
      run_tests:
        required: false
        type: boolean
        default: true
    secrets:
      DATABASE_URL:
        required: false

jobs:
  node-build:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true
      - name: Build
        run: npm run build --if-present
      - name: Test
        if: inputs.run_tests
        run: npm test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || ':memory:' }}
          NODE_ENV: test
