name: Next.js CI — Build & Test

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '20'
      run_tests:
        required: false
        type: boolean
        default: true
    secrets:
      NEXT_PUBLIC_API_URL:
        required: false

jobs:
  nextjs-build:
    name: Next.js Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check --if-present
        continue-on-error: true
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
      - name: Test
        if: inputs.run_tests
        run: npm test --if-present
